const DATA={"works":[{"id":"discobolo","name":"Discóbolo","short":"Movimiento en equilibrio","period":"Arte clásico, ca. 460–450 a. C.","location":"Palazzo Massimo, Roma (copia romana)","author":"Original atribuido a Mirón","material":"Original de bronce perdido; copias romanas en mármol","tag":"El atleta y el movimiento","intro":"Un atleta se dispone a lanzar el disco. La tensión de su cuerpo queda organizada en una composición rigurosa: fuerza, ritmo y equilibrio conviven en un solo instante.","fact":"No contemplamos el bronce original de Mirón: se perdió. Las versiones conservadas son copias romanas, con diferencias de restauración.","details":[["La posición del cuerpo","La torsión de hombros, cadera y piernas construye una secuencia visual que anticipa el lanzamiento."],["El ideal atlético","El entrenamiento y las competiciones formaban parte de la vida religiosa y cívica en el mundo griego."],["La cabeza y las copias","La cabeza del Discóbolo Townley fue restaurada con una orientación equivocada; la versión Lancellotti conserva mejor la dirección de la mirada."],["Bronce y mármol","El original griego probablemente era de bronce; las copias romanas en mármol suelen requerir apoyos adicionales."]],"photos":[{"file":"Discòbol Lancellotti (s. II dC). Museu Nacional Romà (Palau Massimo), Roma.jpg","author":"Vicenç Valcárcel Pérez","license":"CC BY-SA 4.0","note":"Fotografía actual de la escultura"},{"file":"The Discobolus Lancellotti, Roman copy of a 5th century BC Greek original by Myron, Hadrianic period, Palazzo Massimo alle Terme (11398129933).jpg","author":"Carole Raddato","license":"CC BY-SA 2.0","note":"Copia romana del Discóbolo Lancellotti"}],"source":"https://www.britishmuseum.org/collection/object/G_1805-0703-43","questions":["¿Qué gesto anticipa la figura?","¿Por qué existen distintas versiones del Discóbolo?"]},{"id":"venus","name":"Venus de Milo","short":"Belleza, misterio y serenidad","period":"Arte helenístico, ca. 150–125 a. C.","location":"Museo del Louvre, París","author":"Escultor griego no establecido con certeza","material":"Mármol; obra griega original","tag":"Afrodita y el ideal de belleza","intro":"La diosa Afrodita aparece en una postura serena pero sutilmente girada. La unión entre el torso y la tela plegada combina sensualidad, idealización y un extraordinario dominio escultórico.","fact":"Fue hallada en 1820 en la isla de Milo. No se conocen con certeza la posición original de sus brazos ni los atributos que sostenía.","details":[["Identidad de la diosa","La interpretación más extendida identifica a la figura con Afrodita, llamada Venus por los romanos."],["Contrapposto","El peso parece descansar más en una pierna y genera un giro suave entre cadera, torso y hombros."],["El misterio de los brazos","Existen hipótesis sobre una manzana, un escudo u otro atributo; ninguna reconstrucción es definitiva."],["El drapeado","Los pliegues aportan profundidad, contrastan con las superficies lisas y enfatizan la torsión."]],"photos":[{"file":"Venus de Milo front 2023.jpg","author":"Caeciliusinhorto","license":"CC BY-SA 4.0","note":"Fotografía actual de la escultura"},{"file":"Venus de Milo front right 2023.jpg","author":"Caeciliusinhorto","license":"CC BY-SA 4.0","note":"Vista tres cuartos"},{"file":"Venus de Milo back left 2023.jpg","author":"Caeciliusinhorto","license":"CC BY-SA 4.0","note":"Vista posterior"}],"source":"https://www.louvre.fr/es/explora/recorridos/obras-maestras/una-llegada-providencial-al-louvre","questions":["¿Qué elementos de la figura crean equilibrio?","¿Cómo distinguir una hipótesis de un dato comprobado?"]},{"id":"victoria","name":"Victoria de Samotracia","short":"El triunfo convertido en movimiento","period":"Arte helenístico, ca. 190 a. C.","location":"Museo del Louvre, París","author":"Autoría desconocida","material":"Mármol de Paros; base en forma de proa","tag":"Niké, viento y victoria naval","intro":"Niké, diosa de la victoria, parece descender sobre la proa de un barco. Sus grandes alas, la postura adelantada y los pliegues agitados hacen que el mármol sugiera viento y movimiento.","fact":"Fue hallada en Samotracia en 1863. Se conservan fragmentos que han permitido distintas restauraciones; no se recuperaron su cabeza ni sus brazos completos.","details":[["La diosa Niké","Sus alas y su gesto de llegada la vinculan con la victoria: probablemente con una conmemoración naval."],["La proa del navío","La base no es un bloque decorativo: representa la parte delantera de una embarcación."],["Drapería húmeda","La tela se adhiere a unas zonas y se desprende de otras para sugerir un viento intenso."],["Conservación y restauración","El monumento conserva partes antiguas y reconstrucciones modernas; estas deben explicarse al interpretar su aspecto actual."]],"photos":[{"file":"Winged Victory of Samothrace 2023.jpg","author":"APK","license":"CC BY-SA 4.0","note":"Fotografía actual de la escultura"},{"file":"Winged Victory of Samothrace looking up.jpg","author":"APK","license":"CC BY-SA 4.0","note":"Fotografía actual de la escultura"},{"file":"The Winged Victory of Samothrace.jpg","author":"Will46and2","license":"CC BY-SA 4.0","note":"Fotografía actual de la escultura"}],"source":"https://www.louvre.fr/en/explore/visitor-trails/the-louvre-s-masterpieces/an-uplifting-sight","questions":["¿Qué función tiene la base de la estatua?","¿Cómo logra el escultor sugerir viento con piedra?"]},{"id":"laocoonte","name":"Laocoonte y sus hijos","short":"El drama humano en piedra","period":"Tradición helenística tardía; datación debatida","location":"Museos Vaticanos, Roma","author":"Tradicionalmente vinculado a escultores de Rodas","material":"Mármol; grupo escultórico","tag":"Tensión, serpientes y tragedia","intro":"Un padre y sus dos hijos luchan contra serpientes marinas. La obra transforma el relato troyano en una composición de angustia, anatomía tensa y movimientos entrelazados.","fact":"El grupo se descubrió en Roma en 1506. Los Museos Vaticanos proponen una fecha cercana a 40–30 a. C., aunque su datación ha sido discutida.","details":[["El relato troyano","Según versiones antiguas del mito, Laocoonte advierte a los troyanos del peligro que representa el caballo de madera."],["Las dos serpientes","Los animales forman curvas que conectan a los tres personajes y conducen nuestra mirada de un rostro a otro."],["El pathos","La expresión del dolor y la tensión muscular convierten a la escena en un ejemplo notable de dramatismo escultórico."],["Redescubrimiento en 1506","Su hallazgo en Roma fascinó a artistas del Renacimiento y alentó el estudio de la Antigüedad."]],"photos":[{"file":"Laokoon in Vatican.jpg","author":"Vitold Muratov","license":"CC BY-SA 4.0","note":"Fotografía actual de la escultura"},{"file":"Laocoön and His Sons (6995028645).jpg","author":"Erik Drost","license":"CC BY 2.0","note":"Grupo escultórico en los Museos Vaticanos"}],"source":"https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/museo-pio-clementino/Cortile-Ottagono/laocoonte.html","questions":["¿Cómo conecta la serpiente a los personajes?","¿Cuál es la diferencia entre mito y acontecimiento histórico?"]}],"timeline":[{"date":"ca. 460–450 a. C.","name":"Mirón y el Discóbolo","body":"El original de bronce atribuido a Mirón representa una síntesis clásica de movimiento y medida."},{"date":"ca. 190 a. C.","name":"Victoria de Samotracia","body":"Se realiza un monumento dedicado a Niké, posiblemente vinculado con un triunfo naval."},{"date":"ca. 150–125 a. C.","name":"Venus de Milo","body":"Una Afrodita de mármol reúne tradición clásica y sensibilidad helenística."},{"date":"Época helenística tardía / romana","name":"Laocoonte y sus hijos","body":"La datación del grupo se debate. Los Museos Vaticanos proponen aproximadamente 40–30 a. C."},{"date":"1506","name":"Hallazgo del Laocoonte","body":"El grupo se encuentra en Roma y pronto forma parte de las colecciones pontificias."},{"date":"1820–1821","name":"Venus: hallazgo y llegada al Louvre","body":"Descubierta en Melos en 1820, la estatua entra en las colecciones del Louvre en 1821."},{"date":"1863","name":"Descubrimiento de la Victoria","body":"Se recuperan fragmentos en la isla de Samotracia. El monumento se recompone gradualmente."},{"date":"Siglos XX–XXI","name":"Estudio y restauración","body":"La investigación de materiales, copias y restauraciones sigue transformando nuestra comprensión de estas obras."}],"quiz":[{"q":"¿A quién se atribuye el original perdido del Discóbolo?","a":["Fidias","Mirón","Praxíteles"],"correct":1,"why":"Se atribuye a Mirón, escultor activo en el siglo V a. C."},{"q":"¿Qué material tenía probablemente el Discóbolo griego original?","a":["Bronce","Plástico","Yeso"],"correct":0,"why":"El original estaba hecho en bronce; lo conocemos a través de copias romanas."},{"q":"¿En qué isla se descubrió la Venus de Milo?","a":["Creta","Rodas","Melos (Milo)"],"correct":2,"why":"Fue hallada en la isla griega de Melos en 1820."},{"q":"¿Qué sabemos de los brazos originales de la Venus de Milo?","a":["Su posición exacta es incierta","Ambos sujetaban una espada","Jamás tuvo brazos"],"correct":0,"why":"La posición original sigue siendo materia de hipótesis."},{"q":"¿A qué diosa representa la Victoria de Samotracia?","a":["Atenea","Niké","Hera"],"correct":1,"why":"Niké era la personificación de la victoria."},{"q":"¿Qué representa la base de la Victoria de Samotracia?","a":["Una montaña","Un altar circular","La proa de un barco"],"correct":2,"why":"La composición evoca una llegada triunfal sobre una embarcación."},{"q":"¿Qué recurso sugiere el viento en la Victoria?","a":["Drapeados agitados","Un escudo","Una inscripción"],"correct":0,"why":"Los pliegues de la vestimenta crean el efecto de viento y movimiento."},{"q":"¿A quién acompañan las dos figuras jóvenes en el Laocoonte?","a":["Al emperador Augusto","Al sacerdote Laocoonte","A Mirón"],"correct":1,"why":"El relato muestra a Laocoonte y sus dos hijos luchando con serpientes."},{"q":"¿Qué significa «pathos» en el análisis de Laocoonte?","a":["Una clase de piedra","El tamaño de la estatua","Expresión intensa de sufrimiento y emoción"],"correct":2,"why":"El dramatismo y la expresión emocional son esenciales en su composición."},{"q":"¿Cuál afirmación interpreta correctamente estas cuatro obras?","a":["Todas son originales griegos conservados sin cambios","Son de épocas y trayectorias distintas; algunas tienen copias o restauraciones","Todas fueron halladas en Roma"],"correct":1,"why":"El conocimiento histórico distingue los originales, las copias romanas, los hallazgos y las restauraciones."}],"art":["data:image/webp;base64,UklGRj5YAABXRUJQVlA4IDJYAAAQfwGdASqQAY0BPnU0lUgkoqIjp1OcWJAOiWNsp7WacejdGfN5/1df+93gOgC/q+ADn6eWrP/KBbi9BqATXto4+P+XqXZJ+hZ4fYDtFMF33yK7cH/i9e/9l3gPmi/c/1bPUx/cPUP/2Hpheth/iPUd/Z3rpP8BjvcpnnLjH6n/t/8ZyAuzvNb72ZN+dTAXyA740BX2U40vt77BHGEfmfUZ8mz/d83X6F/xfYa/Y0Codt1OBvXJqOUHR+6llusaPdFvIqPKfpFmEDtPkGpxXKyz969g9TbDPQ50ezYKk9FBpSjRyyozYEWHXT/sv5EW/4trGY0EHwOQ6XrcEfipD90YPne4hzTpjncWYVhjK1b3vYhRC/5gBKvL0F30EKoNjkaHwdwL6Tk32OM1/p6lHnR45+OqaHzL0oV3PE/f/wqaTXN6LpHUWRicz0n5RpuYZECGobUR2LjV6OsQQTkmtbI8HuIRV13cQeMTXL4o8xiP5TZueuG60ic34JS7++q9r98epQppRF30m7/zo6Jx6vI4HbErQUbroGGVBFiF63RBHVEf4XySBgGrfjua7u71Zns+bc9yTR5eXYDYbnz0ZTYfrsQHb3D8XIv+CYmELJW7EjMsaKyO7RUrnb2HiQGFrHTut7fJmH6cL+SVTN2dFem4NkbMtUxjm7b7Acytb+jnOZ9nKFJzrTamYUz14IegBCSjif2VsEhV/DdRXEUYXCLgaMdeCPSB8A2jRstB4AXM2qQBUFxS9lMk1LIHa7JGbi6Axwf14xfdoZ3k6Ku3C/cP/SSAFsdD4zLMftgx1AdHd9BsRx013BIjDDPWGvHsSF/squcyr4BWGEoOAAohs4d7WdCSYkAeo6gJFJ9TReFkgVMb8f9lUq4zlJQASGsRsyuoC/KW/1+j5hC+I18zQpJ+REAbDwg5pu/3jga+WwZKQZTvYowWUqCHNpqfPZJ9T0e9MFqmTbkPNGmARxpwv5W7JS6mrDwBGukGQ+fJYb7GrILjzlLcX1FO5wNmE3hEonykzUZ7WpEh0t/zdtRNxaVI1GCWBkoO5HE5t2Sahgyq1Au5fRRZ8TN9HSDGf//dyEDdJyLT3CuYAf1AgQn+X4INHGy4TMXCahNtWIoLx6eHzUiYjWfyBg8wYqz3zH/EM5U6ctzw1iQydJeh7rhV6qK6qg3i/2/fKTWEtnB5d1UGaKFG6exisnL03MqYMDMOgMUDk/INfhSvKsuLNdE84H1j1Dmq/Eq83clwGqYHb4mb/YLgJ8/2dIEMYKiZQAehxTlkvfYlSVrNK8aEZYEsDYRlGnLLXmc666i6k5ogViAUVh 'Del mundo griego a los descubrimientos modernos: reconstruye la historia de las obras y su influencia.',
'Diez preguntas con retroalimentación para comprobar lo que aprendiste en tu recorrido.'
];
const guides=[
'¡Bienvenidos! Soy Guille, el jaguar guía de Historia con Levi. Vamos a descubrir cuatro grandes obras de escultura griega. Recuerda observar sus detalles y distinguir las fotografías de las recreaciones.',
'Observa el Discóbolo. ¿Puedes reconocer cómo el atleta distribuye su peso? El original en bronce de Mirón está perdido; conocemos la obra por copias romanas.',
'Esta es la Venus de Milo. Representa probablemente a Afrodita. Mira la torsión del torso y los pliegues de la tela. Todavía no sabemos la posición exacta que tenían sus brazos.',
'La Victoria de Samotracia se posa sobre la proa de un barco. Mira las alas y los pliegues como si el viento estuviera soplando. Su conservación incluye restauraciones modernas.',
'Laocoonte y sus hijos luchan contra serpientes marinas. Esta es una escena de un mito, no una fotografía de un acontecimiento real. El dolor y la anatomía hacen expresiva la obra.',
'Comparemos la proporción, el movimiento y la emoción. No todos los ejemplos de arte helenístico son iguales: la Venus es bastante serena y la Victoria es muy dinámica.',
'Las esculturas poseen su propia historia: creación, hallazgo, restauraciones y vida en un museo. Explora los acontecimientos de la línea del tiempo.',
'¡Llegó el desafío! Responde diez preguntas y descubre qué tan bien conoces las esculturas. Puedes repetirlo las veces que quieras.'
];
const state={room:0,photo:0,hot:0,compare:[0,3],timeline:0,quiz:0,answers:{},voice:false};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photoPage=photo=>'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(photo.file.replace(/ /g,'_'));
const photoUrl=photo=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(photo.file.replace(/ /g,'_'))+'?width=1024';
function artIndex(workIndex){return Math.min(6,workIndex+1)}
function photoFallback(img,wi){img.onerror=null;img.src=DATA.art[artIndex(wi)];img.dataset.kind='ai';img.alt+=' (se muestra recreación artística como respaldo)';const holder=img.closest('.gallery-main,.hero-image,.exhibit-card,.compare-card,.modal-box');const label=holder&&holder.querySelector('.photo-label');if(label)label.textContent='RECREACIÓN ARTÍSTICA CON IA · NO ES FOTOGRAFÍA';}
function picture(wi,pi,cls='card-photo',onClick=''){
 const w=W[wi],p=w.photos[Math.min(pi,w.photos.length-1)];return `<img class="${cls}" src="${photoUrl(p)}" data-kind="photo" data-wi="${wi}" alt="Fotografía de ${esc(w.name)} · ${esc(p.note)}" loading="${cls==='hero-img'?'eager':'lazy'}" onerror="photoFallback(this,${wi})" ${onClick?'data-open="'+wi+'-'+pi+'"':''}>`;
}
function hero(){const r=state.room,wi=Math.max(0,Math.min(3,r-1)),work=W[wi];const special=r===0||r>=5;
const title=special?[ 'Obras maestras de la escultura griega','','','','','Clásico y helenístico: compara','La historia detrás de las obras','El desafío final de Guille'][r]:work.name;
const sub=special?summaries[r]:work.short;
const bgwi=r===0?2:r===5?0:r===6?2:r===7?3:wi;
const localImg=special?DATA.art[r===0?0:r===5?5:r===6?6:0]:null;
const pic=localImg?`<img src="${localImg}" alt="Ilustración artística creada con IA para ambientación museográfica" loading="eager">`:picture(bgwi,0,'hero-img');
const label=localImg?'RECREACIÓN AMBIENTAL CON IA': 'FOTOGRAFÍA · WIKIMEDIA COMMONS';
const tags= special?['8 salas interactivas','4 esculturas','Guille, tu guía','Fotografías y fuentes']: [work.period,work.location,'Galería de fotografías'];
return `<section class="hero" aria-label="Presentación de sala"><div class="hero-copy"><div class="eyebrow">EXPOSICIÓN 05 · SALA ${r+1} DE 8</div><h1>${esc(title)}</h1><p class="hero-sub">${esc(sub)}</p><p class="hero-lead">${special?(r===0?'Admira los originales y sus copias, analiza el arte y descubre los relatos que conservan estas piezas. Una experiencia educativa para estudiantes de secundaria.':summaries[r]):esc(work.intro)}</p><div class="hero-over">${tags.map(t=>`<span class="meta-pill">${esc(t)}</span>`).join('')}</div><div class="actions"><button class="gold-btn" data-go="${Math.min(7,r+1)}">${r===7?'Volver a repasar':'Siguiente sala'} →</button>${!special?`<a href="${work.source}" target="_blank" rel="noopener noreferrer" class="plain-btn">Fuente del museo ↗</a>`:''}</div></div><div class="hero-image">${pic}<span class="photo-label">${label}</span></div></section>`;
}
function introRoom(){return `<div class="section-head"><div><div class="eyebrow">EXPLORACIÓN HISTÓRICA</div><h2>Cuatro obras, muchas preguntas</h2><p class="info-copy">Abre una obra y descubre su historia, sus detalles escultóricos y lo que aún investigan los especialistas.</p></div></div><div class="grid-four">${W.map((w,i)=>`<article class="exhibit-card"><div style="position:relative">${picture(i,0,'card-photo')}<span class="photo-label" style="bottom:auto;top:10px;left:10px">FOTO / RESPALDO IA</span></div><div class="card-copy"><span class="num-over">OBRA ${String(i+1).padStart(2,'0')}</span><h3>${esc(w.name)}</h3><p>${esc(w.short)}</p><div class="actions"><button class="gold-btn" data-go="${i+1}">Explorar →</button><button class="plain-btn" data-speak="${i+1}">▶ Guille</button></div></div></article>`).join('')}</div><div class="insight"><article><strong>Observa</strong><p>Identifica postura, gestos, materiales y proporciones.</p></article><article><strong>Interpreta</strong><p>Distingue la intención artística de lo que conocemos por fuentes.</p></article><article><strong>Investiga</strong><p>Aprende qué elementos son originales, copias o restauraciones.</p></article></div>`;}
function workRoom(){const wi=state.room-1,w=W[wi],pi=Math.min(state.photo,w.photos.length-1),p=w.photos[pi],d=w.details[state.hot];return `<div class="section-head"><div><div class="eyebrow">SALA ${state.room+1} · OBSERVACIÓN DE OBRA</div><h2>Explora ${esc(w.name)}</h2><p class="info-copy">Selecciona fotografías, toca los puntos numerados y amplía la pieza.</p></div></div><section class="work-gallery"><div class="gallery-main">${picture(wi,pi,'active-art')}<span class="photo-label">FOTOGRAFÍA · WIKIMEDIA COMMONS</span><div class="hotspot-points">${w.details.map((d,i)=>`<button class="hotspot ${i===state.hot?'active':''}" data-hot="${i}" style="left:${[18,64,28,74][i]}%;top:${[22,29,65,71][i]}%" aria-label="Analizar ${esc(d[0])}">${i+1}</button>`).join('')}</div><div class="gallery-hover"><span>${esc(p.note)} · ${esc(p.author)}</span><button class="plain-btn" data-open="${wi}-${pi}">⛶ Ampliar</button></div></div><div class="thumb-strip">${w.photos.map((ph,i)=>`<button class="thumb ${i===pi?'selected':''}" data-photo="${i}">Vista ${i+1} ↗</button>`).join('')}</div><div class="detail-note" aria-live="polite"><div class="eyebrow">PUNTO ${state.hot+1} DE 4</div><h3>${esc(d[0])}</h3><p>${esc(d[1])}</p></div><div class="work-info"><div class="fact"><strong>Contexto y autoría</strong><p>${esc(w.author)} · ${esc(w.period)}</p></div><div class="fact"><strong>Material y conservación</strong><p>${esc(w.material)}</p></div><div class="fact"><strong>Ubicación</strong><p>${esc(w.location)}</p></div><div class="fact"><strong>¿Sabías que…?</strong><p>${esc(w.fact)}</p></div></div><div class="question-box"><div class="eyebrow">OBSERVA Y REFLEXIONA</div>${w.questions.map(q=>`<p>• ${esc(q)}</p>`).join('')}</div><div class="source-note">Foto: ${esc(p.author)} · ${esc(p.license)} · <a href="${photoPage(p)}" target="_blank" rel="noopener noreferrer">Ver licencia, archivo y atribución ↗</a></div></section>`;}
function compareRoom(){const [a,b]=state.compare;return `<div class="section-head"><div><div class="eyebrow">SALA 06 · COMPARACIÓN INTERACTIVA</div><h2>Estilos, emociones y materiales</h2><p class="info-copy">Elige dos obras para analizar sus diferencias. Las características son tendencias, no reglas absolutas.</p></div></div><div class="compare-grid">${[a,b].map((wi,slot)=>`<div class="compare-card"><div class="card-copy"><label class="choose-label" for="compare${slot}">OBRA ${slot+1} · CAMBIA LA SELECCIÓN</label><select class="work-select" id="compare${slot}" data-comp="${slot}">${W.map((w,i)=>`<option value="${i}" ${i===wi?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>${picture(wi,0,'compare-art')}<div class="card-copy"><h3>${esc(W[wi].name)}</h3><p>${esc(W[wi].period)}. ${esc(W[wi].short)}.</p><button class="plain-btn" data-go="${wi+1}">Visitar esta sala →</button></div></div>`).join('')}</div><table class="compare-table"><thead><tr><th>Criterio</th><th>${esc(W[a].name)}</th><th>${esc(W[b].name)}</th></tr></thead><tbody>${[['Periodo',W[a].period,W[b].period],['Procedencia museográfica',W[a].location,W[b].location],['Tema',W[a].tag,W[b].tag],['Material / testimonio',W[a].material,W[b].material],['Una clave de lectura',W[a].details[0][1],W[b].details[0][1]]].map(r=>`<tr>${r.map(t=>`<td>${esc(t)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="question-box"><strong class="gold">Una distinción histórica:</strong><p class="small">La serenidad no es exclusiva del periodo clásico, ni el movimiento del helenístico. La Venus de Milo es helenística y conserva una expresión equilibrada; el Discóbolo clásico ya sugiere una acción intensa.</p></div>`;}
function timelineRoom(){const t=DATA.timeline[state.timeline];return `<div class="section-head"><div><div class="eyebrow">SALA 07 · INVESTIGA EL PASADO</div><h2>Creación, descubrimientos y conservación</h2><p class="info-copy">Selecciona un periodo para descubrir cómo cambia la historia de estas piezas.</p></div></div><div class="timeline-nav" aria-label="Fechas históricas">${DATA.timeline.map((t,i)=>`<button class="plain-btn ${i===state.timeline?'gold-btn':''}" data-timeline="${i}" aria-pressed="${i===state.timeline}">${esc(t.date)}</button>`).join('')}</div><div class="timeline-card" aria-live="polite"><div class="eyebrow">ACONTECIMIENTO ${state.timeline+1} DE ${DATA.timeline.length} · ${esc(t.date)}</div><h3>${esc(t.name)}</h3><p>${esc(t.body)}</p><div class="actions"><button class="plain-btn" data-tprev="1" ${state.timeline===0?'disabled':''}>← Anterior</button><button class="gold-btn" data-tnext="1" ${state.timeline===DATA.timeline.length-1?'disabled':''}>Siguiente acontecimiento →</button></div></div><ul class="checklist"><li>Una escultura tiene una fecha de creación y, a veces, otra de restauración o de descubrimiento.</li><li>Los materiales, las copias y los hallazgos arqueológicos son evidencias; las reconstrucciones deben reconocerse como interpretaciones.</li><li>La conservación busca proteger las piezas originales y explicar sus transformaciones posteriores.</li></ul>`;}
function quizRoom(){const i=state.quiz,n=DATA.quiz.length;let score=DATA.quiz.reduce((z,q,j)=>z+(state.answers[j]===q.correct?1:0),0);if(i>=n)return `<div class="quiz-box quiz-result"><div class="eyebrow">RECORRIDO COMPLETADO</div><div style="font-size:55px">🏆</div><div class="score">${score} / ${n}</div><h3>${score>=9?'¡Excelente mirada histórica!':score>=6?'Buen trabajo, explorador':'Continúa investigando'}</h3><p>${score>=9?'Reconoces las obras y diferencias sus evidencias históricas.':score>=6?'Tienes una buena base. Repasa las salas con más dudas.':'Repasa las piezas, observa las fotografías y vuelve a intentarlo.'}</p><div class="actions" style="justify-content:center"><button class="gold-btn" data-resetquiz="1">↺ Repetir desafío</button><button class="plain-btn" data-go="0">Volver al inicio</button></div></div>`;
const q=DATA.quiz[i],ans=state.answers[i];return `<div class="section-head"><div><div class="eyebrow">SALA 08 · EVALUACIÓN FORMATIVA</div><h2>El desafío de Guille</h2><p class="info-copy">Diez preguntas, tres opciones y explicación inmediata. Puedes repetir el ejercicio.</p></div></div><div class="quiz-box"><div class="eyebrow">PREGUNTA ${i+1} DE ${n} · ${score} ACIERTOS</div><div class="quiz-progress"><span style="width:${(i/n)*100}%"></span></div><h3>${esc(q.q)}</h3><div class="quiz-choices">${q.a.map((opt,k)=>`<button class="quiz-choice ${ans!==undefined?(k===q.correct?'correct':k===ans?'wrong':''):''}" data-answer="${k}" ${ans!==undefined?'disabled':''}>${String.fromCharCode(65+k)}. ${esc(opt)}</button>`).join('')}</div>${ans!==undefined?`<div class="quiz-feedback" aria-live="polite"><strong style="color:${ans===q.correct?'var(--green)':'var(--red)'}">${ans===q.correct?'¡Respuesta correcta!':'Revisemos la respuesta'}</strong><p style="margin:5px 0">${esc(q.why)}</p></div><div class="actions"><button class="gold-btn" data-nextquiz="1">${i===n-1?'Ver resultado final →':'Siguiente pregunta →'}</button></div>`:'<p class="small muted">Selecciona una alternativa. Después leerás la explicación histórica.</p>'}</div>`;}
function sidebar(){return `<aside class="sidebar"><div class="panel guille-box"><div class="eyebrow">TU GUÍA DEL MUSEO</div><div class="guille-pic"><img src="${DATA.guille}" alt="Guille, jaguar amarillo del Museo Historia con Levi"><div><div class="guille-name">¡Hola, soy Guille!</div><p style="margin:4px 0">Te acompaño en las ocho salas.</p></div></div><p id="guilleText">${esc(guides[state.room])}</p><div class="speak-group"><button class="plain-btn" data-speak="${state.room}">▶ Escuchar</button><button class="plain-btn" data-stop="1">■ Detener</button></div><p class="tiny muted" style="margin:11px 0 0">Narración sintética disponible según el navegador y las voces instaladas.</p></div><div class="mini-stat"><strong>${state.room+1} / 8</strong><div>Salas del recorrido histórico</div><div class="line" style="margin:12px 0"></div> Fotografías y enlaces oficiales del Louvre, Museos Vaticanos y British Museum.</div></aside>`;}
function sourceSection(){const unique=[];W.forEach(w=>w.photos.forEach(p=>{if(!unique.find(q=>q.file===p.file))unique.push(p)}));return `<section class="sources" id="fuentes"><h2>Fuentes, fotografías y criterios museográficos</h2><p class="disclosure">Las imágenes fotográficas proceden de Wikimedia Commons y conservan los términos de sus autores; abre cada ficha para consultar la licencia. Si una imagen externa no carga, aparece una recreación artística generada con IA, identificada claramente. Estas recreaciones no deben confundirse con el aspecto arqueológico real ni con fotografías.</p><div class="source-links">${W.map(w=>`<a href="${w.source}" target="_blank" rel="noopener noreferrer">${esc(w.name)} · institución ↗</a>`).join('')}</div><details style="margin-top:15px"><summary style="cursor:pointer;color:var(--pale)">Ver créditos de todas las fotografías (${unique.length})</summary><ul class="source-list">${unique.map(p=>`<li><a href="${photoPage(p)}" target="_blank" rel="noopener noreferrer">${esc(p.file)}</a><div>${esc(p.author)} · ${esc(p.license)}</div></li>`).join('')}</ul></details><p class="tiny muted">Museo educativo sin finalidad comercial. Cuando una fotografía esté bajo CC BY-SA, su reutilización debe respetar la atribución, la licencia y las condiciones de compartir igual que correspondan. Para trabajos derivados de estas fotografías, consulta sus fichas y licencias.</p></section>`;}
function renderNav(){ $('#roomNav').innerHTML=names.map((n,i)=>`<button class="room-btn ${i===state.room?'active':''}" data-go="${i}" aria-current="${i===state.room?'page':'false'}"><strong>${String(i+1).padStart(2,'0')}</strong>${esc(n)}</button>`).join(''); }
function render(keepScroll=false){const top=window.scrollY;renderNav();const r=state.room,content=r===0?introRoom():r<=4?workRoom():r===5?compareRoom():r===6?timelineRoom():quizRoom();$('#appRoot').innerHTML=hero()+`<main class="content"><section class="panel" id="roomContent" tabindex="-1" aria-label="Contenido de la sala ${r+1}">${content}</section>${sidebar()}</main><nav class="footer-nav" aria-label="Controles para avanzar entre salas"><button class="plain-btn" data-go="${Math.max(0,r-1)}" ${r===0?'disabled':''}>← Sala anterior</button><p>SALA ${r+1} DE 8 · HISTORIA CON LEVI | CARPE DIEM</p><button class="gold-btn" data-go="${Math.min(7,r+1)}" ${r===7?'disabled':''}>Siguiente sala →</button></nav>`+sourceSection();bind();if(keepScroll)window.scrollTo({top,behavior:'instant'});}
function selectRoom(room){stopVoice();state.room=Math.max(0,Math.min(7,room));state.photo=0;state.hot=0;render(false);history.replaceState(null,'','#escultura-sala-'+(state.room+1));window.scrollTo({top:0,behavior:'smooth'});}
function bind(){ $$('[data-go]').forEach(b=>b.addEventListener('click',()=>selectRoom(Number(b.dataset.go))));$$('[data-photo]').forEach(b=>b.addEventListener('click',()=>{state.photo=Number(b.dataset.photo);render(true)}));$$('[data-hot]').forEach(b=>b.addEventListener('click',()=>{state.hot=Number(b.dataset.hot);render(true)}));$$('[data-comp]').forEach(el=>el.addEventListener('change',()=>{state.compare[Number(el.dataset.comp)]=Number(el.value);render(true)}));$$('[data-timeline]').forEach(el=>el.addEventListener('click',()=>{state.timeline=Number(el.dataset.timeline);render(true)}));$$('[data-tprev]').forEach(el=>el.addEventListener('click',()=>{state.timeline=Math.max(0,state.timeline-1);render(true)}));$$('[data-tnext]').forEach(el=>el.addEventListener('click',()=>{state.timeline=Math.min(DATA.timeline.length-1,state.timeline+1);render(true)}));$$('[data-answer]').forEach(el=>el.addEventListener('click',()=>{if(state.answers[state.quiz]===undefined){state.answers[state.quiz]=Number(el.dataset.answer);render(true)}}));$$('[data-nextquiz]').forEach(el=>el.addEventListener('click',()=>{state.quiz++;render(true)}));$$('[data-resetquiz]').forEach(el=>el.addEventListener('click',()=>{state.quiz=0;state.answers={};render(true)}));$$('[data-open]').forEach(el=>el.addEventListener('click',()=>{let [wi,pi]=el.dataset.open.split('-').map(Number);openModal(wi,pi)}));$$('[data-speak]').forEach(el=>el.addEventListener('click',()=>speak(Number(el.dataset.speak))));$$('[data-stop]').forEach(el=>el.addEventListener('click',stopVoice));}
function openModal(wi,pi){const w=W[wi],p=w.photos[pi];$('#modalRoot').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Imagen ampliada de ${esc(w.name)}"><div class="modal-box"><div class="modal-top"><div><div class="eyebrow">AMPLIACIÓN FOTOGRÁFICA</div><h3 style="margin:5px 0">${esc(w.name)}</h3></div><button class="modal-x" id="closeModal" aria-label="Cerrar ventana">×</button></div>${picture(wi,pi,'expanded')}<p class="small">${esc(p.note)} · ${esc(p.author)} · ${esc(p.license)} · <a target="_blank" rel="noopener noreferrer" href="${photoPage(p)}">Archivo y crédito en Wikimedia Commons ↗</a></p></div></div>`;$('#closeModal').focus();$('#closeModal').onclick=closeModal;$('.modal').addEventListener('click',e=>{if(e.target.classList.contains('modal'))closeModal()});}
function closeModal(){$('#modalRoot').innerHTML='';}
function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel();state.voice=false;}
function speak(room){if(!('speechSynthesis' in window)){alert('Este navegador no admite voz sintética.');return}stopVoice();const ut=new SpeechSynthesisUtterance(guides[room]);ut.lang='es-MX';ut.rate=.96;ut.pitch=.94;const voices=window.speechSynthesis.getVoices();ut.voice=voices.find(v=>v.lang==='es-MX')||voices.find(v=>v.lang.startsWith('es'))||null;window.speechSynthesis.speak(ut);state.voice=true;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='ArrowRight'&&e.altKey&&state.room<7)selectRoom(state.room+1);if(e.key==='ArrowLeft'&&e.altKey&&state.room>0)selectRoom(state.room-1)});
window.addEventListener('hashchange',()=>{let match=location.hash.match(/^#escultura-sala-(\d+)$/);if(match&&Number(match[1])-1!==state.room)selectRoom(Number(match[1])-1)});
let h=location.hash.match(/^#escultura-sala-(\d+)$/);if(h)state.room=Math.max(0,Math.min(7,Number(h[1])-1));render();
</script>
</body></html>
